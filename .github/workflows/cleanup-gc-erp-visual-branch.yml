name: Cleanup GC ERP Visual Branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-gc-erp-visual-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged visual-system branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/feat/gc-erp-visual-system"
