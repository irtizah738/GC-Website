name: Regenerate Package Lock

on:
  push:
    branches:
      - feat/gc-erp-visual-system
    paths:
      - '.github/workflows/regenerate-package-lock.yml'

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gc-erp-visual-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from current package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          git config user.name "Gotham Coders"
          git config user.email "irtizah738@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore: synchronize package lockfile"
          git push origin HEAD:feat/gc-erp-visual-system
