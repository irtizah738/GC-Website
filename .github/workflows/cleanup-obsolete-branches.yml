name: Cleanup Obsolete Branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "feat/authentic-product-visuals"
            "feat/flagship-product-showcase"
            "feat/gc-erp-repository-showcase"
            "feat/research-case-study-hub"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
          done
