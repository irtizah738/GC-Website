name: Website Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload regenerated lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
