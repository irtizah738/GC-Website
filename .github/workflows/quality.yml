name: Website Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate dependency lock
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
